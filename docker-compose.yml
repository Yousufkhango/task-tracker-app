services:
  backend:
    build: ./task-tracker-backend
    container_name: todo-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  frontend:
    build: ./task-tracker-frontend
    container_name: todo-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --url http://todo-frontend:80
    depends_on:
      - frontend
