version: '3.8'

services:
  # Express Backend API
  backend:
    build: ./backend
    container_name: todo-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  # React / Vite Frontend
  frontend:
    build: ./frontend
    container_name: todo-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # Cloudflare Tunnel Service
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}